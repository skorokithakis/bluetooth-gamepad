; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_4MB.csv

; Use OTG for USB Host; debug output via UART on GPIO12/13.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    ; Use the USB peripheral in OTG mode (USB Host).
    -DARDUINO_USB_MODE=0
    ; Debug output uses a hardware UART, not USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Delay before initializing USB Host (ms).
    -DUSB_HOST_START_DELAY_MS=1000
    -DCORE_DEBUG_LEVEL=4
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2

lib_deps =
    h2zero/NimBLE-Arduino@^2.2.1
    lemmingdev/ESP32-BLE-Gamepad@^0.7.4
    https://github.com/esp32beans/ESP32_USB_Host_HID.git

; Dev build: keep USB CDC enabled (easy flash/monitor over USB), disable USB Host.
[env:seeed_xiao_esp32s3_dev]
platform = ${env:seeed_xiao_esp32s3.platform}
board = ${env:seeed_xiao_esp32s3.board}
framework = ${env:seeed_xiao_esp32s3.framework}
monitor_speed = ${env:seeed_xiao_esp32s3.monitor_speed}
upload_speed = ${env:seeed_xiao_esp32s3.upload_speed}
board_build.flash_mode = ${env:seeed_xiao_esp32s3.board_build.flash_mode}
board_build.flash_size = ${env:seeed_xiao_esp32s3.board_build.flash_size}
board_upload.flash_size = ${env:seeed_xiao_esp32s3.board_upload.flash_size}
board_build.partitions = ${env:seeed_xiao_esp32s3.board_build.partitions}

build_flags =
    -DDISABLE_USB_HOST
    -DCORE_DEBUG_LEVEL=4
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2

lib_deps =
    h2zero/NimBLE-Arduino@^2.2.1
    lemmingdev/ESP32-BLE-Gamepad@^0.7.4
